workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodemagicScanbite

    environment:
      flutter: 3.38.9
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.an2app.scanbite

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build iOS Simulator x86_64
        script: |
          flutter build ios --simulator --debug
          cd build/ios/iphonesimulator
          zip -r $CM_BUILD_DIR/Runner_simulator.zip Runner.app

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - Runner_simulator.zip

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
